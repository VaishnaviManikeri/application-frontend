services:
  - type: web
    name: jobtrack-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn jobtrack_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: jobtrack
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: jobtrack-db
    databaseName: jobtrack
    user: jobtrack
    plan: free
